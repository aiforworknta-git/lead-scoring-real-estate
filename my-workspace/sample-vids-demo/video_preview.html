      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      color: #fef08a;

      justify-content: space-between;
      background: #0f172a;

      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;

      display: inline-flex;

<body>

  <div class="player-wrap">

    </div>
  </div>

  <script>
    const scenes = [{"id":1,"name":"Opening Hook","time":"00:00 - 00:06","durationSec":6,"visual":"Cinematic drone shot của dãy phố ẩm thực sầm uất về đêm với ánh đèn vàng rực rỡ, logo Heineken/Tiger nổi bật.","onScreenText":"CHIẾN DỊCH TÁI KÝ RETIE-UP 2026","voiceover":"Chào các chiến binh Sales Rep! Tháng 9 này, cơ hội bùng nổ doanh số kênh On-Premise chính thức mở màn!","bgm":"Upbeat energetic corporate intro"},{"id":2,"name":"Thách Thức & Điểm Nghẽn","time":"00:06 - 00:16","durationSec":10,"visual":"Hình ảnh Dashboard phân tích dữ liệu chỉ số đỏ: 3.194 điểm bán đang dừng phát sinh đơn hàng, tồn kho đại lý tăng cao.","onScreenText":"3.194 QUÁN QUEN CHƯA LÊN ĐƠN BIA","voiceover":"Hơn 3.100 quán quen đang chờ chúng ta tái kích hoạt. Mỗi ngày chậm trễ là một ngày đối thủ tiến gần hơn!","bgm":"Focused, dramatic suspense"},{"id":3,"name":"Gói Đòn Bẩy OSR Retie-up","time":"00:16 - 00:30","durationSec":14,"visual":"Sales Rep chuyên nghiệp cầm tài liệu OSR gặp gỡ chủ quán, bắt tay thân thiện kèm hình ảnh biển hiệu hộp đèn và dù bạt mới.","onScreenText":"GÓI TÀI TRỢ OSR & THƯỞNG SẢN LƯỢNG MỚI","voiceover":"Vũ khí mới đã sẵn sàng: Bộ hồ sơ OSR 1-chạm, gói tài trợ linh hoạt chiết khấu trực tiếp theo thùng và tài trợ full POSM VIP.","bgm":"Inspiring acoustic rhythm"},{"id":4,"name":"Chỉ Số Đột Phá Mục Tiêu","time":"00:30 - 00:44","durationSec":14,"visual":"Thẻ chỉ số to bản phát sáng: Hoàn thành 100% Target Sell-In 375k thùng và giải phóng tồn kho SCD về mức an toàn.","onScreenText":"MỤC TIÊU: 100% TARGET 375K THÙNG","voiceover":"Khóa chặt sản lượng Sell-Out, đưa toàn bộ SubD South 2 và South 9 cán đích ngoạn mục trước tuần cuối tháng!","bgm":"High energy buildup"},{"id":5,"name":"Kế Hoạch Tác Chiến Tuyến","time":"00:44 - 00:54","durationSec":10,"visual":"Lịch trình đi tuyến bản đồ số: Mỗi Sales Rep viếng thăm 5 quán mỗi ngày, gửi ảnh thẻ Zalo 30s chốt số ngay tại điểm bán.","onScreenText":"ĐI TUYẾN THỰC ĐỊA - CHỐT SỐ TẠI CHỖ","voiceover":"Hành động ngay hôm nay: Rà soát danh sách điểm bán trên App, tiếp cận chủ quán và chốt ký thỏa thuận OSR trong tuần này!","bgm":"Fast-paced driving beat"},{"id":6,"name":"Lời Kêu Gọi Về Đích (CTA)","time":"00:54 - 01:00","durationSec":6,"visual":"Tập thể đội ngũ kinh doanh giơ cao ly bia Tiger/Heineken ăn mừng chiến thắng cùng thông điệp quyết tâm.","onScreenText":"VỮNG BƯỚC TIÊN PHONG - CHINH PHỤC ĐỈNH CAO","voiceover":"Cùng nhau, chúng ta sẽ tạo nên kỷ lục doanh số mới! Lên đường thôi các chiến binh!","bgm":"Triumphant orchestral finale"}];
    const promptContent = `Create a high-impact, professional 60-second corporate presentation video in 16:9 widescreen format about "Chiến Dịch Tái Ký Retie-up & Kích Hoạt 3.194 Quán Quen Kênh On-Premise" designed specifically for Heineken & Tiger Commercial Sales Teams.

Goal: Motivate and guide sales representatives to execute outlet retie-up negotiations and reactivate 3,194 inactive outlets using the new OSR workflow.
Tone of Voice: Inspiring, energetic, confident, and highly action-oriented.
Visual Theme: Premium corporate look with Heineken green (#008200), Tiger blue (#0055B8), crisp gold accents, clean bold typography, and smooth cinematic transitions.
Audio: Clear, passionate Vietnamese AI voiceover with an upbeat, driving corporate acoustic background music track.

Please structure the video into the following 6 sequential scenes:

Scene 1 - Opening Hook (00:00 - 00:06):
- Visual Direction: Cinematic drone shot của dãy phố ẩm thực sầm uất về đêm với ánh đèn vàng rực rỡ, logo Heineken/Tiger nổi bật.
- On-Screen Text: "CHIẾN DỊCH TÁI KÝ RETIE-UP 2026"
- AI Voiceover Script: "Chào các chiến binh Sales Rep! Tháng 9 này, cơ hội bùng nổ doanh số kênh On-Premise chính thức mở màn!"
- Background Music: Upbeat energetic corporate intro

Scene 2 - Thách Thức & Điểm Nghẽn (00:06 - 00:16):
- Visual Direction: Hình ảnh Dashboard phân tích dữ liệu chỉ số đỏ: 3.194 điểm bán đang dừng phát sinh đơn hàng, tồn kho đại lý tăng cao.
- On-Screen Text: "3.194 QUÁN QUEN CHƯA LÊN ĐƠN BIA"
- AI Voiceover Script: "Hơn 3.100 quán quen đang chờ chúng ta tái kích hoạt. Mỗi ngày chậm trễ là một ngày đối thủ tiến gần hơn!"
- Background Music: Focused, dramatic suspense

Scene 3 - Gói Đòn Bẩy OSR Retie-up (00:16 - 00:30):
- Visual Direction: Sales Rep chuyên nghiệp cầm tài liệu OSR gặp gỡ chủ quán, bắt tay thân thiện kèm hình ảnh biển hiệu hộp đèn và dù bạt mới.
- On-Screen Text: "GÓI TÀI TRỢ OSR & THƯỞNG SẢN LƯỢNG MỚI"
- AI Voiceover Script: "Vũ khí mới đã sẵn sàng: Bộ hồ sơ OSR 1-chạm, gói tài trợ linh hoạt chiết khấu trực tiếp theo thùng và tài trợ full POSM VIP."
- Background Music: Inspiring acoustic rhythm

Scene 4 - Chỉ Số Đột Phá Mục Tiêu (00:30 - 00:44):
- Visual Direction: Thẻ chỉ số to bản phát sáng: Hoàn thành 100% Target Sell-In 375k thùng và giải phóng tồn kho SCD về mức an toàn.
- On-Screen Text: "MỤC TIÊU: 100% TARGET 375K THÙNG"
- AI Voiceover Script: "Khóa chặt sản lượng Sell-Out, đưa toàn bộ SubD South 2 và South 9 cán đích ngoạn mục trước tuần cuối tháng!"
- Background Music: High energy buildup

Scene 5 - Kế Hoạch Tác Chiến Tuyến (00:44 - 00:54):
- Visual Direction: Lịch trình đi tuyến bản đồ số: Mỗi Sales Rep viếng thăm 5 quán mỗi ngày, gửi ảnh thẻ Zalo 30s chốt số ngay tại điểm bán.
- On-Screen Text: "ĐI TUYẾN THỰC ĐỊA - CHỐT SỐ TẠI CHỖ"
- AI Voiceover Script: "Hành động ngay hôm nay: Rà soát danh sách điểm bán trên App, tiếp cận chủ quán và chốt ký thỏa thuận OSR trong tuần này!"
- Background Music: Fast-paced driving beat

Scene 6 - Lời Kêu Gọi Về Đích (CTA) (00:54 - 01:00):
- Visual Direction: Tập thể đội ngũ kinh doanh giơ cao ly bia Tiger/Heineken ăn mừng chiến thắng cùng thông điệp quyết tâm.
- On-Screen Text: "VỮNG BƯỚC TIÊN PHONG - CHINH PHỤC ĐỈNH CAO"
- AI Voiceover Script: "Cùng nhau, chúng ta sẽ tạo nên kỷ lục doanh số mới! Lên đường thôi các chiến binh!"
- Background Music: Triumphant orchestral finale

`;
    let currentIdx = 0;
    let isPlaying = false;
    let timer = null;

    function renderScene(idx) {
      currentIdx = idx;
      const s = scenes[currentIdx];
      document.getElementById('sceneBadge').textContent = `SCENE ${s.id} / ${scenes.length} • ${s.name.toUpperCase()}`;
      document.getElementById('timeCode').textContent = s.time;
      document.getElementById('screenTitle').textContent = s.onScreenText;
      document.getElementById('visualCue').textContent = `🎬 Visual Cue: ${s.visual}`;
      document.getElementById('voiceoverSub').textContent = `🎙️ Voiceover: "${s.voiceover}"`;
      document.getElementById('progressText').textContent = `Phân cảnh: ${currentIdx + 1} / ${scenes.length} (${s.time})`;
    }

    document.getElementById('nextBtn').addEventListener('click', () => {
      renderScene((currentIdx + 1) % scenes.length);
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      renderScene((currentIdx - 1 + scenes.length) % scenes.length);
    });

    document.getElementById('playBtn').addEventListener('click', () => {
      if (isPlaying) {
        clearInterval(timer);
        isPlaying = false;
        document.getElementById('playBtn').textContent = '▶ Tự Động Chạy';
      } else {
        isPlaying = true;
        document.getElementById('playBtn').textContent = '⏸ Tạm Dừng';
        timer = setInterval(() => {
          renderScene((currentIdx + 1) % scenes.length);
        }, 5000);
      }
    });

    renderScene(0);
  </script>
